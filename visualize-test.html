<div id="visualize-test" aria-labelledby="visualize-test-title">
  <style>
    #visualize-test {
      display: grid;
      gap: 1rem;
      color: var(--foreground);
    }

    #visualize-test .test-heading {
      display: grid;
      gap: 0.25rem;
    }

    #visualize-test h2 {
      margin: 0;
    }

    #visualize-test .test-stage {
      display: grid;
      place-items: center;
      min-height: 280px;
    }

    #visualize-test svg {
      display: block;
      width: min(100%, 520px);
      height: auto;
      overflow: visible;
    }

    #visualize-test .orbit {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.5;
    }

    #visualize-test .orbit-secondary {
      fill: none;
      stroke: var(--viz-series-1);
      stroke-width: 2;
      opacity: 0.45;
    }

    #visualize-test .sun {
      fill: var(--viz-series-1);
    }

    #visualize-test .planet {
      fill: var(--viz-series-2);
    }

    #visualize-test .moon {
      fill: var(--viz-series-3);
    }

    #visualize-test .stage-label {
      fill: var(--muted-foreground);
      font-size: 12px;
    }

    #visualize-test .viz-controls {
      max-width: 520px;
    }
  </style>

  <div class="test-heading">
    <h2 id="visualize-test-title">Orbit playground</h2>
    <span class="text-muted">A tiny interactive visualization test</span>
  </div>

  <div class="test-stage">
    <svg viewBox="0 0 520 280" role="img" aria-labelledby="orbit-title orbit-description">
      <title id="orbit-title">A planet orbiting a sun</title>
      <desc id="orbit-description">Adjust the orbit tilt to change the planet's path around the sun.</desc>
      <g id="orbit-scene">
        <ellipse class="orbit" cx="260" cy="140" rx="178" ry="78"></ellipse>
        <ellipse id="secondary-orbit" class="orbit-secondary" cx="260" cy="140" rx="178" ry="78"></ellipse>
        <circle class="sun" cx="260" cy="140" r="24"></circle>
        <circle id="planet" class="planet" cx="438" cy="140" r="12"></circle>
        <circle id="moon" class="moon" cx="456" cy="140" r="5"></circle>
        <text class="stage-label" x="260" y="244" text-anchor="middle" id="tilt-readout" aria-live="polite">Tilt: 0°</text>
      </g>
    </svg>
  </div>

  <div class="viz-controls">
    <label class="form-label" for="tilt-control">Orbit tilt <span class="text-muted" id="tilt-value">0°</span></label>
    <input class="form-range" id="tilt-control" type="range" min="-35" max="35" value="0" step="1" aria-describedby="tilt-readout">
  </div>

  <script>
    (() => {
      const root = document.getElementById('visualize-test');
      const control = root.querySelector('#tilt-control');
      const scene = root.querySelector('#orbit-scene');
      const secondaryOrbit = root.querySelector('#secondary-orbit');
      const planet = root.querySelector('#planet');
      const moon = root.querySelector('#moon');
      const value = root.querySelector('#tilt-value');
      const readout = root.querySelector('#tilt-readout');

      const update = () => {
        const tilt = Number(control.value);
        const label = `${tilt}°`;
        scene.setAttribute('transform', `rotate(${tilt} 260 140)`);
        secondaryOrbit.setAttribute('transform', `rotate(${-tilt * 0.6} 260 140)`);
        planet.setAttribute('transform', `rotate(${-tilt * 0.8} 260 140)`);
        moon.setAttribute('transform', `rotate(${-tilt * 1.2} 260 140)`);
        value.textContent = label;
        readout.textContent = `Tilt: ${label}`;
      };

      control.addEventListener('input', update);
      update();
    })();
  </script>
</div>
